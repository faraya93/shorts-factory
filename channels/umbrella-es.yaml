visual_identity:
  # NON-COLOUR identity fields and shared Editor pass. The colour fields (background, palette, text theme) are GENERATED from the active
  # preset above by factory/identity.py (visual_identity_block): never edit colours here. Each production embeds the generated block.
  # QA scope (owner decision): the backdrop and its QA apply only to establishing shots and code3d productions; close-ups are exempt.
  lighting: bright soft studio, one large soft key, cool-white rim, gentle shadow under the object (Cycles shadow-catcher floor), no halo, no vignette
  materials: simplified chunky smooth-shaded models, real PBR colours (painted plastic, rubber, brushed steel), flat clean cross-section cuts, no outlines, no cel bands, no photo textures
  unify:                              # shared Editor pass for every scene, whatever its engine: grain is MANDATORY (it hides the 8-bit gradient steps)
    saturation: 1.04
    contrast: 1.03
    warmth: 0.0
    grain: 5
    vignette_angle: 0
    lift: ""
  qa_tolerance_de: 15                 # starting value (CIE76); ~2.3 is a just-noticeable difference

render:
  # Production render defaults (owner decision 2026-10-28, from docs/render-bench.md). Exported to Blender with the identity snapshot.
  # profiles.tuned = default; profiles.previous = the profile before the change. Per-scene-type overrides: scene_types maps a scene script to a
  # type, scene_type_profiles picks the profile for that type (the rider bench in docs/render-profile-rider.md decides them).
  default_profile: tuned
  profiles:
    tuned: {samples_ceiling: 128, adaptive_threshold: 0.04, min_samples: 24, denoise_gpu: true, transmission_bounces: 0, volume_bounces: 0, diffuse_bounces: 3, glossy_bounces: 4, max_bounces: 8, persistent_data: true,
      fast_gi: false}
    previous: {samples_ceiling: 128, adaptive_threshold: 0.02, min_samples: 0, denoise_gpu: false, transmission_bounces: 12, volume_bounces: 0, diffuse_bounces: 4, glossy_bounces: 4, max_bounces: 6, persistent_data: false,
      fast_gi: false}
  scene_types: {tape_02: cross_section, tape_05: exploded_housing}
  scene_type_profiles: {cross_section: tuned, exploded_housing: tuned}
  draft_engine: eevee

audio:                                # starting profile from the pilot; the clip gate keeps music out of the mix
  narration_volume: 1.0
  effects_volume: 0.30
  clip_audio: effects
  clip_gate_db: -35
  music_volume: 0.10
  music_file: null                    # no signature track chosen yet

spinoff_criteria:                     # spin-off channels are decided later, only by data — never micro-topic splits
  - a topic family that consistently wins AND can sustain its own publishing cadence
  - the English-language version of the channel
