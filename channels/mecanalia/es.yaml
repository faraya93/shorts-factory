# channels/mecanalia/es.yaml: MECANALIA ES, the Spanish variant. A thin channel package: it stores only what differs from the brand
# (channels/mecanalia/brand.yaml); everything else is inherited by reference (factory/channel.py merges brand + this file, this file wins).
# Public and versioned: NO platform credentials here, ever (tokens live only in the orchestrator's credential store).

channel: mecanalia-es
extends: mecanalia
language: es
register: neutral pan-Hispanic Spanish — universal topics, no country-specific systems, no local slang
promise: "Por qué y cómo funcionan las cosas que ves y usas todos los días"   # umbrella curiosity channel

handles:                               # intended handles; creating and verifying accounts belongs to the owner / the orchestrator
  primary: "@mecanalia"
  fallbacks: [mecanalia_es, mecanalia.es]    # only if the primary is taken on a platform

voice:
  default: es-CL-LorenzoNeural         # provisional: the owner has not chosen yet; Lorenzo stays default until they do
  audition_candidates: [es-CL-LorenzoNeural, es-MX-JorgeNeural, es-ES-AlvaroNeural, es-CL-CatalinaNeural]

duration:
  words_per_second: 2.87               # measured on the pilot narration (126 words in 43.9 s)

publish:                               # texts the marketing lens uses to build each video's publish package (Spanish)
  bio: "Por qué y cómo funcionan las cosas que ves y usas todos los días, explicado paso a paso. Un mecanismo por video. Sígueme."
  bios:                                # final per-platform profile bios, ready to paste; `bio` above is the canonical wording (tests/test_channel.py checks the limits)
    # EVERGREEN by owner ruling (2026-11-01): no technique named (not every video is 3D) and no video titles (they age as the catalogue grows).
    instagram: "Por qué y cómo funcionan las cosas que ves y usas todos los días, explicado paso a paso. Un mecanismo por video. Sígueme."   # limit 150
    tiktok: "Por qué funcionan las cosas que usas a diario, paso a paso. Sígueme."   # limit 80; the canonical does not fit, so: the same promise, shortened
    facebook: "Por qué y cómo funcionan las cosas que ves y usas todos los días, explicado paso a paso. Un mecanismo por video. Sígueme. Si te dio curiosidad, envíaselo a ese amigo que cree que todo funciona por magia."   # limit 255; canonical + the share ask
    youtube: "Por qué y cómo funcionan las cosas que ves y usas todos los días, explicado paso a paso. Un mecanismo por video. Sígueme.\n\nCada video toma algo de tu día a día y te enseña cómo funciona, un paso a la vez. Si te dio curiosidad, envíaselo a ese amigo que cree que todo funciona por magia."   # limit 1000; canonical + what each video does + the share ask
  description_template: |
    {hook_and_twist}
    {supportive_note}
  hashtags:                            # tags only; the counts and slot order are the brand rule (brand.yaml publish.hashtags)
    base: ["#shorts"]                  # fixed, minimal, always LAST: a repeated big base wastes the visible slots and dilutes topical signal
    family: {objects: "#comofunciona", body: "#cuerpohumano", numbers: "#curiosidades", whatif: "#quepasaria"}  # one per topic_family, always present
  playlists:                           # OWNER 2026-11-08 (supersedes the four family playlists of commit 09df8fc): ONE public playlist; the families are internal taxonomy, never public structure. Created BY THE OWNER on the platform.
    - {name: "Empieza aquí", contents: "the channel's published videos, strongest performers first, as measured by the channel's analytics"}
  share_cta: "Sígueme, y envíaselo a {share_archetype}."
