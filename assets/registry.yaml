# Free asset sources, in search order. Read by factory/asset_library.py; explained in docs/current/specs/asset-system.md.
# status: connected = usable today | approved-pending-account = owner approved it, wiring ready, waiting for the owner's account | owner-step = would need an account only the owner may create | candidate = found, not wired or tested
# Facts below were checked live on the "verified" date. Re-verify before relying on an old date: these services rename and change terms.
licence_rule: "CC0 preferred; Royalty-Free acceptable; CC-BY only with the attribution recorded in the asset README; anything unclear is not used."
# ADVANCE ASSETS (rule recorded 2026-11-08, docs/current/specs/asset-system.md "Advance assets"): an element class that recurs (>= 2 committed scripts or idea-bank entries, or one finished production that paid to improvise it) is built ONCE in advance as a sealed library asset with the poses, states and motion controls its scripts demand. Sources and licences here apply to an advance build exactly as to any other asset; nothing here changes the search order. First instance when its trigger fires: hands and fingers (human-hand is one fixed pose, no rig). No asset built by this note.
sources:
  - id: polyhaven
    priority: 1
    name: Poly Haven
    url: https://polyhaven.com
    provides: [hdris, pbr-textures, models]
    access: "MCP for Blender: search_assets + import_asset, source polyhaven. Public API without MCP: https://api.polyhaven.com/assets?t=models"
    account_required: false
    licence: CC0-1.0
    status: connected
    verified: 2026-11-04
    notes: >
      The library switch is OFF by default in each Blender session; set bpy.context.scene.blendermcp_use_polyhaven = True first.
      Search is fuzzy and always returns something: "human heart" returned a marble bust and "popcorn" returned a croissant. A hit is not a match; judge it by eye.
      Realistic scans, often one baked mesh with no separable parts, so check the brief's moving parts before taking one.
  - id: ambientcg
    priority: 2
    name: ambientCG
    url: https://ambientcg.com
    provides: [pbr-textures]
    access: "API: https://ambientcg.com/api/v2/full_json?q=<q>&type=Material ; zip: https://ambientcg.com/get?file=<Id>_2K-JPG.zip"
    account_required: false
    licence: CC0-1.0
    status: connected
    verified: 2026-11-04
    notes: Materials only. Downloads go in code3d/assets/materials/ and are logged in code3d/assets/LICENSES.md, like every non-hero asset.
  - id: blenderkit
    priority: 3
    name: BlenderKit free plan (domain now blendkit.com, repo BlenderKit/Blendkit)
    url: https://www.blendkit.com
    provides: [models, materials]
    access: ".venv/bin/python tools/asset_blender.py blenderkit-search <words> ; .venv/bin/python tools/asset_blender.py blenderkit-get <asset-base-id> <new-empty-folder>"
    account_required: false
    licence: per asset; accept only cc_zero (CC0-1.0) or royalty_free (Royalty-Free, terms https://www.blendkit.com/docs/licenses/). The tool refuses anything else.
    status: connected
    verified: 2026-11-04
    notes: >
      Anonymous search and download, allowed by owner decision 2026-11-04; no account. Verified live: real CC0 .blend files downloaded and opened. It needs curl (Python's urllib gets 403).
      Royalty-Free allows commercial use without credit but forbids reselling the asset as such; library binaries are never distributed. Downloads are untrusted files: open without -y and take data with bpy.data.libraries.load.
  - id: sketchfab
    priority: 3
    name: Sketchfab free downloads
    url: https://sketchfab.com
    provides: [models]
    access: "MCP for Blender: search_assets + import_asset, source sketchfab. Token handed over in .env; tools/asset_blender.py open passes it to Blender."
    account_required: true
    licence: per model; accept only CC0 or CC Attribution. Refuse NC, ND, SA and Editorial.
    status: connected
    verified: 2026-11-04
    notes: >
      Approved by the owner and connected 2026-11-04 with the owner's free account; the token stays in .env. Verified live: a real search and a real import of a CC Attribution model, through tools/asset_blender.py open.
      Results mix licences, including NonCommercial ones, and the tools do not filter them: read each result's License line and refuse anything but CC0 or CC Attribution. CC-BY means recording the attribution in the asset and carrying it in the video description.
      Realistic hearts may look too graphic for the no-gore rule; prefer clean sculpts or retint.
  - id: polypizza
    priority: 3
    name: Poly Pizza
    url: https://poly.pizza
    provides: [models]
    access: "MCP for Blender: search_assets + import_asset, source polypizza, once the owner pastes a free API key into the add-on preferences."
    account_required: true
    licence: per model; CC0 or CC-BY
    status: owner-step
    verified: 2026-11-04
    notes: Stylised low-poly. Not on the owner's original list; added because MCP for Blender has it built in and the look suits simplified heroes.
  - id: mb-lab
    priority: 4
    name: MB-Lab (parametric human anatomy generator)
    url: https://github.com/animate1978/MB-Lab
    provides: [human-bodies]
    access: "Blender add-on from the GitHub release (1_8_1). Not installed."
    account_required: false
    licence: AGPL-3.0
    status: candidate
    verified: 2026-11-04
    agpl_note: >
      FLAG. Per the project's license page, generated MODELS are AGPL-3.0 and "must be distributed under AGPL 3"; 2D RENDERS (images and video) are not considered a derived
      product, and their author owns them. So videos are fine, but the .blend or mesh itself may not be shared except under AGPL. Library binaries are gitignored and never
      distributed. Each use needs a recorded lens decision (licence.decision).
    notes: >
      The repository is ARCHIVED (last release June 2024, "development has moved onto CharMorph") and states Blender 4.0+. Not tested on our Blender 5.2.3; test before relying on it.
      Whole bodies only, no internal organs. Keep the stylised, no-real-skin look rule.
  - id: charmorph
    priority: 4
    name: CharMorph (MB-Lab's named successor)
    url: https://github.com/Upliner/CharMorph
    provides: [human-bodies]
    access: "Blender add-on; clone with --recursive. Not installed."
    account_required: false
    licence: per base model; secondary sources list Vitruvian CC0, Antonia and Reom CC-BY, MB-Lab base AGPL. Confirm in the project's docs first.
    status: candidate
    verified: 2026-11-04
    notes: Last confirmed target is Blender 4.4 (v0.4.0, March 2025). Not tested on 5.2.3. Prefer it over MB-Lab if it runs, because a CC0 base avoids the AGPL question.
  - id: smithsonian
    priority: 5
    name: Smithsonian 3D Open Access
    url: https://3d.si.edu/collections/openaccesshighlights
    provides: [models]
    access: "Web download; filter on Open Access and confirm the CC0 mark on each model."
    account_required: false
    licence: CC0-1.0 where marked; refuse anything unmarked
    status: candidate
    verified: 2026-11-04
    notes: Gap-filler proposed by this build, not on the owner's list. Fossils, animals and artefacts. Coverage evidence is mostly from 2020 coverage; not wired or tested.
excluded:
  - id: meshy
    reason: generate_3d provider; needs an account, may spend credits, free tier output is CC-BY. Not used at $0 without the owner's OK.
  - id: tripo
    reason: free tier is non-commercial (CLAUDE.md). Never.
  - id: hunyuan3d
    reason: Tencent community licence excludes the EU, UK and South Korea; the channel is global. Not used.
  - id: trellis2
    reason: code is MIT, but its RMBG-2.0 dependency is CC BY-NC 4.0 and DINOv3 has its own licence (blender-kiln's own table). Unclear means not used.
  - id: unimate
    reason: checkpoints are CC BY-NC 4.0 (non-commercial). Not used.
